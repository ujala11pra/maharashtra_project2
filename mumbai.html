<!DOCTYPE html>
<html>
<head>
    <title>Mumbai</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        /* Image bigger */
        .main-img {
            width: 500px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Details box smaller */
        .details {
            background-color: #f3e5d8;
            margin: 30px auto;
            padding: 15px;
            width: 50%;
            border-radius: 10px;
            text-align: left;
        }

        .details h2 {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .details p {
            margin-bottom: 10px;
        }

        ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }

       a {
    position: fixed;
    bottom: 20px;
    left: 20px;

    background: #667eea;
    color: white;
    padding: 10px 15px;
    border-radius: 20px;

    text-decoration: none;
    font-weight: bold;

    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

a:hover {
    background: #764ba2;
}
    </style>

</head>

<body>

<h1>Mumbai</h1>

<!-- Image -->
<img src="mumbai.jpg" alt="Mumbai Image" class="main-img">

<!-- Details -->
<div class="details">
    <p>Mumbai is the financial capital of India known for its fast lifestyle, Bollywood industry, and famous tourist attractions.</p>

    <h2>Famous Restaurants</h2>
    <ul>
        <li>Leopold Cafe</li>
        <li>Trishna Restaurant</li>
        <li>Britannia & Co.</li>
    </ul>

    <h2>Nearby Attractions</h2>
    <ul>
        <li>Gateway of India</li>
        <li>Marine Drive</li>
        <li>Juhu Beach</li>
    </ul>
</div>

<a href="index.html">⬅ Go Back</a>

</body>
</html>
